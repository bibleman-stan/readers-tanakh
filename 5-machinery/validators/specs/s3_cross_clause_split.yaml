name: s3_cross_clause_split
rule: S3
subcase: cross_clause_split
severity: STRONG-SPLIT-CANDIDATE
mode: line

description: |
  Cross-clause split — line carries a recognized closing-formula closer
  immediately followed by a clause-opening wayyiqtol. Strategy A (closed
  positive list) per 2026-04-29 design audit, NOT a generic "split before
  every mid-line wayyiqtol" rule. Per 1-method/canon §1 + §5 H3: Hebrew narrative IS
  a wayyiqtol chain; default-MERGE direction governs at v1→v2 layer; S3 is
  a line-internal fixer for the rare cases where v1 baseline glued a wayyiqtol
  onto a closing fragment that is grammatically NOT a clause-head environment.

  Closed-list signatures (split BEFORE the wayyiqtol):
    Pattern 1: discourse-formula  וַיְהִי־כֵן  (Gen 1 day-formula closer)
    Pattern 2: year-noun  שָׁנָה / שָׁנִים  + begetting/dying wayyiqtol
               (וַיּוֹלֶד / וַיָּמָת / וַיְחִי) — Gen 5, Gen 11 genealogies
    Pattern 3: species-formula  לְמִינָהּ / לְמִינוֹ / לְמִינֵהֶם  + wayyiqtol
               (Gen 1 creation account)

  Example (Gen 1:24 L3):
    Before: בְּהֵמָה וָרֶמֶשׂ וְחַיְתוֹ־אֶרֶץ לְמִינָהּ וַיְהִי־כֵן׃
    After:  בְּהֵמָה וָרֶמֶשׂ וְחַיְתוֹ־אֶרֶץ לְמִינָהּ
            וַיְהִי־כֵן׃
    Signatures: pattern 1 (discourse formula) AND pattern 3 (species closer);
    either alone fires.

  Example (Gen 11:13):
    Before: שָׁנָה וַיּוֹלֶד בָּנִים וּבָנוֹת
    After:  שָׁנָה
            וַיּוֹלֶד בָּנִים וּבָנוֹת
    Signature: pattern 2 (year noun + begetting wayyiqtol).

  Architectural note (2026-04-29): re-enabled with closed-list trigger
  after the prior broad mid-line-wayyiqtol trigger over-fired on every
  narrative wayyiqtol chain (RUNAWAY at pass 25 with 156+ verses oscillating
  in initial S3 trial). Patterns 4-8 (numerical-totals closer + wayyiqtol;
  speech-closer + speech-resumer; place-naming formula; closing temporal
  adjunct) reserved for follow-up after this 3-pattern set proves stable.

trigger:
  line_anywhere:
    closed_list_clause_boundary_wayyiqtol: true

annotation_template: "S3 cross-clause split — closed-list closer + wayyiqtol opener ({pwc} prosodic words)"
suggested_action: SPLIT_AT_FINITE_VERB_BOUNDARY
