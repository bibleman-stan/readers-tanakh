name: m2_4_subject_verb_merge
rule: M2
subcase: subject_verb_merge
severity: STRONG-MERGE-CANDIDATE
description: |
  Short subject NP (1 prosodic word, no finite verb) + line N+1 starting with
  a finite verb. Subject and predicate form the clause nucleus per WO §10
  / JM §125 — they must not be split when both lines are short.

  Example (Gen 4:2):
    line N:    וְקַיִן              (single-word subject NP, no verb)
    line N+1:  הָיָה               (finite verb starting line)
    merge:     וְקַיִן הָיָה        ("and Cain was")

trigger:
  line_n_anywhere:
    has_finite_verb: false        # line N is bare subject (no verb yet)
  line_n1_first_token:
    morphology: finite_verb       # finite verb begins line N+1
  combined_max_prosodic_words: 5

guards:
  - prev_line_incomplete          # only fire when prev clause is complete
                                   # (line N is genuinely a new subject NP,
                                   #  not a stranded modifier)
  - line_n_starts_with_do_marker  # block if line N is a DO continuation of
                                   # the prior clause (e.g., אֶת־חַוָּה אִשְׁתּוֹ
                                   # following וְהָאָדָם יָדַע) — these are
                                   # complement chains, not new subjects
  - next_line_is_wayyiqtol       # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_imperative_clause           # Path 1 H5b — block re-merge of propositionally-complete content
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)

annotation_template: "Subject NP + verb merge ({pwc} prosodic words)"
suggested_action: MERGE
