name: m2_3_verb_subj_do_split
rule: M2
subcase: verb_subj_do_split
severity: STRONG-MERGE-CANDIDATE
description: |
  Verb-clause-head + DO-NP split. Line N contains a finite verb (subject NP
  may follow on same line), line N+1 starts with אֵת (the direct-object marker,
  standalone or maqqef-joined). Per WO §10.3 / JM §125, verb and DO form a
  tight nucleus.

  Example (Gen 1:21):
    line N:    וַיִּבְרָא אֱלֹהִים        (verb + subject)
    line N+1:  אֶת־הַתַּנִּינִם           (DO marker + NP)
    merge:     וַיִּבְרָא אֱלֹהִים אֶת־הַתַּנִּינִם

trigger:
  line_n_anywhere:
    has_finite_verb: true
  line_n1_first_token:
    morphology: do_marker
  combined_max_prosodic_words: 7

guards:
  - both_lines_have_finite_verb         # if both clauses are independent, don't merge
  - next_line_is_wayyiqtol              # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_vav_coord_pp           # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np           # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_vav_coord_do_marker    # block re-absorbing post-S4-split coord-DO continuation
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)
                                          # (Gen 33:2 oscillation, 2026-05-03)

annotation_template: "Verb-clause + DO-NP merge ({pwc} prosodic words)"
suggested_action: MERGE
