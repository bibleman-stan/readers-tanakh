name: m4_d_solo_intransitive_postposed_subject
rule: M4
subcase: solo_intransitive_postposed_subject
severity: STRONG-MERGE-CANDIDATE
description: |
  Single-token bare INTRANSITIVE wayyiqtol on its own line + postposed
  subject (bare-NP / proper noun) on next line. V-S word order ATU bond
  — clause-nucleus integrity (M2 territory: subject + verb = one clause-
  nucleus ATU per 1-method/canon §1), not the retired Path-1 "propositionally
  empty" frame.

  Sister to m4_c_solo_action_verb (transitive V + DO). The next-line
  bare-NP is the verb's SUBJECT (postposed per Hebrew V-S word order),
  binding into the same clause-nucleus as the verb. Distinct from
  m4_solo_speech_verb (now REVIEW-REQUIRED only): speech-act announcements
  ARE propositionally complete on their own under Path 1 §5 H5b;
  intransitive-V + postposed-S binds because subject is the obligatory
  argument that completes the clause-nucleus.

  Stan-flagged 2026-05-02 (Gen 3:1 line 2 `יְהוָה אֱלֹהִים` stranded as
  subject of relative-clause `אֲשֶׁר עָשָׂה` on prior line). Same structural
  shape as the audit-enumerated residual: וַיָּמָת + הֲדָד (Gen 36:36, 10
  instances), וַתָּמָת + רָחֵל, וַתַּהַר + הָאִשָּׁה, וַיִּגְדַּל + הָאִישׁ,
  וַיִּנָּחֶם + יְהוָה, etc.

  Closed list deliberately tight: ONLY intransitive verbs whose postposed
  bare-NP is unambiguously the SUBJECT (death verbs, state-change, niphal
  passives where the agent is the postposed S). Motion verbs (וילך, ויבא,
  וישב, ויעל, וירד, ויחנו, ויסע, ויפל, ויעמד, ויעבר etc.) are EXCLUDED
  because their next-line bare-NP is overwhelmingly a PP-locus complement
  or directional ה (M2.7 territory), not a subject. Copula formulas
  (ויהי / ותהי / ויחי) are EXCLUDED — handled by M5 family.

  Distinct from m2_verb_bare_np_rebond (broader bare-NP rebond): m4_d's
  trigger is tighter (closed-list verb + 1-token line N) and fires before
  the broader spec catches the long tail.

  King-list "buried subject" pattern (Gen 36): the `line_n1_anywhere
  has_finite_verb: false` guard correctly blocks the buried case (where
  next line has wayyiqtol after the bare-NP). S4 multi-wayyiqtol-split
  fires first to separate the buried subject onto its own line; m4_d
  then merges it back on a subsequent cascade pass.

trigger:
  line_n_first_token:
    skeleton_in:
      # Death (qal — subject is the dier; never has obligatory PP)
      - "וימת"      # 3ms
      - "ותמת"      # 3fs
      - "וימתו"     # 3mp
      - "ותמתנה"    # 3fp
      # State-change (qal — subject identifies grower / conceiver)
      - "ויגדל"
      - "ותגדל"
      - "ויגדלו"
      - "ותהר"
      - "וימתקו"
      - "ותכלינה"
      - "ותהם"
      # Niphal "be comforted / relent" (subject is the relenter)
      - "וינחם"
      - "ותנחם"
  line_n_last_token:
    skeleton_in:
      - "וימת"
      - "ותמת"
      - "וימתו"
      - "ותמתנה"
      - "ויגדל"
      - "ותגדל"
      - "ויגדלו"
      - "ותהר"
      - "וימתקו"
      - "ותכלינה"
      - "ותהם"
      - "וינחם"
      - "ותנחם"
  line_n_max_prosodic_words: 1
  line_n1_first_token:
    morphology: bare_noun         # is_bare_noun_token includes proper nouns
                                    # per docstring (NP head / proper / pronoun)
  line_n1_anywhere:
    has_finite_verb: false        # CRITICAL — blocks the king-list buried
                                    # case where next line has wayyiqtol
                                    # after the bare-NP. S4 must split
                                    # those first; m4_d then fires on the
                                    # cleaned-up state.
  line_n1_max_prosodic_words: 4   # postposed S is short
  combined_max_prosodic_words: 6  # tighter than M4.c's 12 (subject is one
                                    # short NP, not a full DO clause)

guards:
  - line_n_ends_with_sof_pasuq    # NEW guard — sof-pasuq on V means clause-
                                    # final cantillation; next verse begins
                                    # fresh clause (1Kgs 16:18 וַיָּמֹֽת׃ |
                                    # עַל־חַטֹּאתָיו)
  - prev_line_incomplete          # ensure line N is genuinely a new clause
                                    # head, not a fragment of prior clause
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP
  - next_line_is_wayyiqtol        # block re-absorbing post-S3/S4-split
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)
                                    # wayyiqtol-headed lines

annotation_template: "Solo intransitive verb + postposed subject ({pwc} prosodic words combined)"
suggested_action: MERGE
