name: hsub2_pen_subordinator
rule: H-sub2
subcase: pen_subordinator
severity: STRONG-MERGE-CANDIDATE
description: |
  Subordinator bond — frozen-phrase subordinators (פֶּן, לְמַעַן, אַחֲרֵי, עַל־כֵּן,
  יַעַן, בִּגְלַל, בִּשְׁבִיל, בַּעֲבוּר) stranded at the end of line N.
  These subordinators form frozen phrases with their content clause and must not
  be split across lines. Guard: poetic register.

trigger:
  line_n_last_token:
    skeleton_in:
      - "פן"
      - "למען"
      - "אחרי"
      - "עלכן"
      - "יען"
      - "בגלל"
      - "בשביל"
      - "בעבור"

guards:
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol      # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)

annotation_template: "H-sub2 subordinator stranded from clause content (combined {pwc} prosodic words)"
suggested_action: MERGE
