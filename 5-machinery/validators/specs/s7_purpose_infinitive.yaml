name: s7_purpose_infinitive
rule: S7
subcase: purpose_infinitive_split
severity: STRONG-SPLIT-CANDIDATE
mode: line

description: |
  Split before a לְ + infinitive-construct purpose phrase that follows a
  finite verb + arguments. The purpose-infinitive predicates a separate
  proposition (matrix subject performing the inf action). Per 1-method/canon §1
  generative principle, each proposition splits by default.

  Tag-driven (TAHOT): infinitive identified via R (prep) + V?c (any verb
  stem in construct aspect) morpheme pair on the same token.

  Example (Gen 1:17):
    וַיִּתֵּן אֹתָם אֱלֹהִים בִּרְקִיעַ הַשָּׁמַיִם לְהָאִיר עַל־הָאָרֶץ
    →
    וַיִּתֵּן אֹתָם אֱלֹהִים בִּרְקִיעַ הַשָּׁמַיִם
    לְהָאִיר עַל־הָאָרֶץ

  FP guards (encoded in helper purpose_infinitive_split_positions):
    - Matrix verb on MODAL_INCEPTIVE_VERB_SKELS list (אבה/חל/כלה/יסף/יכל/
      חפץ/בקש/מהר/מאן) — these take obligatory inf complements; matrix
      valence requires the inf, not a separate ATU.
    - Fewer than 2 substantive tokens between matrix verb and inf →
      tight verb+inf bond, not a purpose clause.
    - Inf line-initial → already its own ATU candidate (mid-line splits
      only).

  Cascade-safety (2026-05-04 carry-forward execution iter 2):
  Re-enabled after deeper M+H partner audit identified the full oscillation-
  partner set:
    - m2_6_verb_subj_pp_recipient + m2_8_speech_verb_subj_pp_recipient
      already carry next_line_is_purpose_infinitive (added iter 1)
    - h14_discourse_particles_stranded + h14_short_pp_completion +
      h18_1_verbless_predicate + h18_3_verb_pp_complement + m2_7_motion_
      verb_locus_pp now carry next_line_is_purpose_infinitive (added iter 2)
    - h11_2_mid_verse_short_fronting + h11_short_verse_fronting carry
      line_n_is_purpose_infinitive (NEW guard for orphan-as-N direction)

  Iter-1 RUNAWAY at Gen 1:22, 18:12, 27:6, 34:1, 38:24, 39:17, 42:3,
  43:3, 45:16, 50:4 (H14/H11/H18.1 partners). Iter-2 should converge.

trigger:
  line_anywhere:
    purpose_infinitive: true

annotation_template: "S7 purpose-infinitive split — separate purpose-clause ATU"
suggested_action: SPLIT_AT_FINITE_VERB_BOUNDARY
