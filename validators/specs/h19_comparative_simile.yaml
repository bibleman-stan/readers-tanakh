name: h19_comparative_simile
rule: H19
subcase: comparative_simile
severity: REVIEW-REQUIRED
description: |
  H19 Comparative Simile Integrity — next line begins with a כְּ-prefixed
  comparative NP ("like X", "as X"). In prose, the simile is often a predicative
  adjunct of the prior line's predicate; merge candidate. In poetic register
  comparative bicolon parallelism is standard, so emit only in prose.

trigger:
  line_n1_first_token:
    skeleton_starts_with:
      - "כ"
  line_n1_anywhere:
    has_finite_verb: false

guards:
  - poetic_register

annotation_template: "H19 comparative simile (כְּ-prefix NP) on next line — potential predicative adjunct (combined {pwc} prosodic words)"
suggested_action: REVIEW
