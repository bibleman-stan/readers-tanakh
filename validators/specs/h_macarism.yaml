name: h_macarism
rule: H-classical
subcase: macarism_opening
severity: REVIEW-REQUIRED
description: |
  Macarism (Classical Comma, Justification 4) — line N ends with אַשְׁרֵי
  (beatitude formula "blessed is / happy is"). The macarism opening may
  legitimately stand as a classical comma (justification 4), but many
  v1-baseline splits strand it from its content clause. Surfaces as
  REVIEW-REQUIRED: editor decides standalone vs. merge. Fires in PROSE
  only; Sifrei Emet (Psalms) אַשְׁרֵי occurrences are skipped.

trigger:
  line_n_last_token:
    skeleton_in:
      - "אשרי"

annotation_template: "Macarism אַשְׁרֵי opening stranded from content (combined {pwc} prosodic words) — classical comma or merge candidate per editor judgment"
suggested_action: REVIEW
