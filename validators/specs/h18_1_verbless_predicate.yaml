name: h18_1_verbless_predicate
rule: H18.1
subcase: verbless_subj_pred_split
severity: STRONG-MERGE-CANDIDATE
description: |
  Verbless clause subject + predicate-PP split. NP-ending line + prep-fronted
  next line, no finite verb either side.

trigger:
  line_n_anywhere:
    has_finite_verb: false
  line_n1_first_token:
    morphology: prep
  line_n1_anywhere:
    has_finite_verb: false
  combined_max_prosodic_words: 8

guards:
  - vocative_position
  - discourse_particle_on_next_line
  - casus_pendens
  - heavy_subject
  - le_infinitive_on_next_line
  - both_lines_have_finite_verb
  - next_line_is_vav_coord_pp   # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol      # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (tag-driven, more precise than le_infinitive_on_next_line)

annotation_template: "H18.1 verbless subj-pred split (combined {pwc} prosodic words)"
suggested_action: MERGE
