name: h16_c_line_final_construct_head
rule: H16
subcase: line_final_construct_head
severity: STRONG-MERGE-CANDIDATE
description: |
  Line N ends with a construct-state noun (head of a construct chain) — the
  nomen rectum is on line N+1. Layer-1 syntax violation: a construct head
  cannot end a colon without its rectum; they form a single complex NP.

  Algorithmic detection (morphology=construct_head): tries the bare skeleton
  against CONSTRUCT_HEAD_SKELETONS (closed list of high-frequency construct
  heads), then strips leading vav / bound-prep / article and retries. This
  catches בְּבֵית, מִבֵּית, וּבְּנֵי, וּמִמַּפְרִיסֵי, etc. without enumerating every
  prefix combination in the closed list.

  Audited 2026-04-29 (Waves 1-3):
    Esther 2:1   חֲמַת / הַמֶּלֶךְ
    Lev 11:4     מִמַּפְרִיסֵי / הַפַּרְסָה
    1 Chr 1:6    וּבְנֵי / גֹּמֶר          (genealogy collapse)
    Ruth 1:2     בְּבֵית-לֶחֶם / יְהוּדָה   (toponym integrity)
    Neh 3:7      עֵבֶר / הַנָּהָר
    Ezra 7:1     מֶלֶךְ / פָּרָס
    Gen 18:1     אֵלֹנֵי / מַמְרֵא          (toponym)
    Isa 1:24     אֲבִיר / יִשְׂרָאֵל         (oracle attribution)
    1 Chr 2:7    בְּנֵי / זֶרַח              (genealogy)

trigger:
  line_n_last_token:
    morphology: construct_head
  combined_max_prosodic_words: 12

guards:
  - both_lines_have_finite_verb   # if both have finite verbs, independent clauses
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol      # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)
  - line_n_last_token_has_pronominal_suffix   # FP guard 2026-05-05: ראשי / כוסי / שמו — Sp*-suffixed nouns are NOT bare construct heads (the suffix IS the rectum). Surfaced by Psa 23:5 trace.

annotation_template: "Line-final construct head stranded ({pwc} prosodic words)"
suggested_action: MERGE
