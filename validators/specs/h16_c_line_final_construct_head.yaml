name: h16_c_line_final_construct_head
rule: H16
subcase: line_final_construct_head
severity: STRONG-MERGE-CANDIDATE
description: |
  Line N ends with a construct-state noun (head of a construct chain) — the
  nomen rectum is on line N+1. Layer-1 syntax violation: a construct head
  cannot end a colon without its rectum; they form a single complex NP.

  Closed-list approach (per canon §1 hybrid policy — niqqud-blind, lexical):
  catches the most common construct heads that appear stranded across lines.
  Plural-construct (-ei suffix), feminine singular construct (-t suffix), and
  high-frequency masculine construct forms.

  Audited 2026-04-29:
    Esther 2:1   חֲמַת / הַמֶּלֶךְ
    Lev 11:4     מִמַּפְרִיסֵי / הַפַּרְסָה
    1 Chr 11:4   יֹשְׁבֵי / הָאָרֶץ
    2 Kgs 17:7   מִתַּחַת יַד / פַּרְעֹה
    Exod 34:4    שְׁנֵי / לֻחֹת אֲבָנִים
    Num 27:20    כָּל־עֲדַת / בְּנֵי יִשְׂרָאֵל

trigger:
  line_n_last_token:
    skeleton_in:
      # Plural masc construct (-ei suffix). Skel often ends in 'י'.
      - "יושבי"
      - "אנשי"
      - "בני"
      - "ימי"
      - "שני"
      - "אבי"
      - "אחי"
      - "מלכי"
      - "זקני"
      - "שרי"
      - "ראשי"
      - "כל"
      - "בית"
      - "אהל"
      - "מפריסי"   # those dividing of (Lev 11:4 audit)
      - "מעלי"     # those bringing up of (Lev 11:4 audit)
      # Feminine singular construct (-t suffix)
      - "חמת"
      - "אשת"
      - "בת"
      - "מלכת"
      - "תורת"
      - "רוח"
      - "עדת"
      - "ארץ"
      - "עיר"
      - "מצות"
      # Masculine construct (often = absolute)
      - "יד"
      - "פי"
      - "שם"
      - "דבר"
      - "מקום"
      - "הר"
      - "עם"
      - "גוי"
      - "שדה"
      - "יום"
      - "ראש"
      - "ארון"
      - "מצוה"
      # Vav-prefix variants (וּבְנֵי / וְאַנְשֵׁי / וּמִמַּפְרִיסֵי / וּמַעֲלֵי).
      # Audited: 1 Chr 1:6 'וּבְנֵי / גֹּמֶר'; Lev 11:4 'וּמִמַּפְרִיסֵי / הַפַּרְסָה'.
      - "ובני"
      - "ובית"
      - "ובת"
      - "ובנות"
      - "וכל"
      - "ואנשי"
      - "ואחי"
      - "ואשת"
      - "ושם"
      - "וימי"
      - "ושני"
      - "ועדת"
      - "ועם"
      - "וארץ"
      - "ועיר"
      - "וממפריסי"
      - "וממעלי"
      - "ומפריסי"
      - "ומעלי"
      - "מבני"
      - "ובן"
      - "מבן"
      - "ובכל"
      - "בכל"
      - "מכל"
      - "לכל"
      # Maqqef-prefixed variants (כָּל־עֲדַת etc.)
      - "כלעדת"
      - "כלאנשי"
      - "כלבית"
  combined_max_prosodic_words: 9

guards:
  - poetic_register
  - both_lines_have_finite_verb   # if both have finite verbs, they're independent clauses

annotation_template: "Line-final construct head stranded ({pwc} prosodic words)"
suggested_action: MERGE
