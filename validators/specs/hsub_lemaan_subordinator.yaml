name: hsub_lemaan_subordinator
rule: H-sub
subcase: lemaan_subordinator
severity: STRONG-MERGE-CANDIDATE
description: |
  Subordinator bond — לְמַעַן (purpose subordinator "in order that / for the sake
  of") stranded at the end of line N. The subordinator must not be split from
  its clause. Combined pair must be short (≤8 prosodic words); longer purpose
  clauses may legitimately stand as independent cola.
  Guard: poetic register.

trigger:
  line_n_last_token:
    skeleton_in:
      - "למען"
  combined_max_prosodic_words: 8

guards:
  - poetic_register
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol      # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)

annotation_template: "H-sub לְמַעַן subordinator stranded from purpose clause (combined {pwc} prosodic words)"
suggested_action: MERGE
