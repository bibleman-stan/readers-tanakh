name: m2_5_verb_participle_complement
rule: M2
subcase: verb_participle_complement
severity: STRONG-MERGE-CANDIDATE
description: |
  Periphrastic / verb + participial complement: finite verb (typically היה /
  יהיה) on line N followed by a bare participle on line N+1. The two form
  a compound predicate per WO §37.6.1.

  Example (Gen 4:2):
    line N:    וְקַיִן הָיָה
    line N+1:  עֹבֵד אֲדָמָה
    merge:     וְקַיִן הָיָה עֹבֵד אֲדָמָה ("and Cain was a tiller of soil")

trigger:
  line_n_anywhere:
    has_finite_verb: true
  line_n1_first_token:
    morphology: bare_participle
  line_n1_anywhere:
    has_finite_verb: false
  combined_max_prosodic_words: 7

guards:
  - poetic_register
  - heavy_participial_complement   # don't merge if participle has heavy DO+PP
  - next_line_is_wayyiqtol       # block re-absorbing post-S3-split wayyiqtol-headed lines
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_interrogative_clause        # Path 1 H5b — block re-merge of propositionally-complete content
  - next_line_is_imperative_clause           # Path 1 H5b — block re-merge of propositionally-complete content
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)

annotation_template: "Verb + participial complement ({pwc} prosodic words)"
suggested_action: MERGE
