name: m2_coordinated_object
rule: M2
subcase: coordinated_do_split
severity: STRONG-MERGE-CANDIDATE
description: |
  Compound direct-object split: את + NP // וְאֵת + NP under one shared verb.
  Both halves serve as compound DO of a single verb on a prior line.

trigger:
  line_n_first_token:
    skeleton_in: ["את"]
  line_n1_first_token:
    skeleton_in: ["ואת"]
  combined_max_prosodic_words: 8

guards:
  - poetic_register
  - both_lines_have_finite_verb
  - heavy_subject
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol     # block re-absorbing post-S3-split wayyiqtol-headed lines
  - combined_lines_s6_eligible # block re-absorbing post-S6-split waet-coord-acc-NP enumeration members
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)

annotation_template: "Coordinated DO split: את-NP // וְאֵת-NP (combined {pwc} prosodic words)"
suggested_action: MERGE
