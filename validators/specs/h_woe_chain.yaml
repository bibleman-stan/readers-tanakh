name: h_woe_chain
rule: H-woe
subcase: woe_chain_opening
severity: STRONG-MERGE-CANDIDATE
description: |
  Woe-Chain Handling — line N begins with הוֹי or אוֹי (prophetic woe particle).
  Tightened trigger (line_n_max_prosodic_words: 2) per Stan 2026-05-05 REVIEW-
  REQUIRED ban + spec audit ab3890fd8ee2249bd: only stranded short woe particles
  (אוֹי לָנוּ type) merge; full oracle lines (line N is content-complete) are
  excluded.

trigger:
  line_n_first_token:
    skeleton_in:
      - "הוי"
      - "אוי"
  line_n_max_prosodic_words: 2

annotation_template: "H-woe prophetic woe-particle merge — short stranded woe opening (combined {pwc} prosodic words)"
suggested_action: MERGE
