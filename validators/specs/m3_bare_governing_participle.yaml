name: m3_bare_governing_participle
rule: M3
subcase: bare_governing_participle
severity: STRONG-MERGE-CANDIDATE
description: |
  M3 Bare-Governor Indivisibility — bare active/passive participle on line N
  with complement (PP, direct object, or clause marker) leading line N+1.
  The bare participle fails the atomic-thought test: it is grammatical machinery
  awaiting content and must merge with its complement.

trigger:
  line_n_last_token:
    morphology: bare_participle
  line_n_anywhere:
    has_finite_verb: false
  line_n_max_prosodic_words: 1   # "bare" means line N is a single token
  combined_max_prosodic_words: 6

guards:
  - poetic_register
  - heavy_participial_complement
  - next_line_is_vav_coord_pp     # canon §1: enumeration members are atomic; M3 must not absorb post-S1 splits
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol         # symmetric for post-S3 splits
  - next_line_is_purpose_infinitive   # block re-absorbing post-S7 purpose-INF orphans (defensive)

annotation_template: "M3 bare governing participle stranded from complement (combined {pwc} prosodic words)"
suggested_action: MERGE
