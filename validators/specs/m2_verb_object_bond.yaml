name: m2_verb_object_bond
rule: M2
subcase: verb_et_strand
severity: STRONG-MERGE-CANDIDATE
description: |
  Layer 1 + canon M2 — finite verb at line end + DO marker את on next line.
  Splitting between verb and direct-object marker fragments the clause nucleus.

trigger:
  line_n_anywhere:
    has_finite_verb: true
  line_n1_first_token:
    skeleton_in: ["את"]

guards:
  - poetic_register
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol     # block re-absorbing post-S3-split wayyiqtol-headed lines

annotation_template: "M2 verb-object bond split: verb-end + את-front (combined {pwc} prosodic words)"
suggested_action: MERGE
