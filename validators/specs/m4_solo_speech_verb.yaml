name: m4_solo_speech_verb
rule: M4
subcase: solo_speech_verb
severity: STRONG-MERGE-CANDIDATE
description: |
  Single-token bare wayyiqtol speech-verb on its own line — propositionally
  empty without its complement clause on the next line.

  Distinct from the multi-word-line speech-verb-at-end case
  (which is REVIEW-REQUIRED in `validate_speech_intro_framing.py`):
  this spec covers ONLY the case where the entire line consists of just
  one wayyiqtol speech verb. That case is unambiguously a merge.

  Concrete instance (audit 2026-05-01 D4 Class E, target):
    1 Sam 1:18 lines 89-90:
      וַתֹּ֕אמֶר                                        (and she said)
      תִּמְצָ֧א שִׁפְחָתְךָ֛ חֵ֖ן בְּעֵינֶ֑יךָ            (may your maidservant find favor in your eyes)
                ^ should merge — solo speech verb

  Why a spec mirrors the standalone validator: `apply_validators.py`
  enters PRESERVE mode on chapters where v2/he diverges from
  v1+adopted_validators output, so new STRONG findings from the
  standalone validator don't get applied to existing v2/he. The
  spec_runner cascade has no PRESERVE limitation — this spec is the
  enforcement mechanism for the class.

  Closed list of speech-verb skels mirrors
  `BARE_SPEECH_VERB_SKELETONS` in `validate_speech_intro_framing.py`.

trigger:
  line_n_first_token:
    skeleton_in:
      - "ויאמר"
      - "ויאמרו"
      - "וידבר"
      - "וידברו"
      - "ותאמר"
      - "ותאמרו"
      - "ותדבר"
      - "ויען"
      - "ותען"
      - "ויוסף"
  line_n_last_token:
    skeleton_in:
      - "ויאמר"
      - "ויאמרו"
      - "וידבר"
      - "וידברו"
      - "ותאמר"
      - "ותאמרו"
      - "ותדבר"
      - "ויען"
      - "ותען"
      - "ויוסף"
  line_n_max_prosodic_words: 1
  combined_max_prosodic_words: 25   # speech complement may be long (extended quotation)

guards:
  - poetic_register
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol        # block re-absorbing post-S3-split wayyiqtol-headed lines

annotation_template: "Solo speech verb stranded — propositionally empty without complement ({pwc} prosodic words combined)"
suggested_action: MERGE
