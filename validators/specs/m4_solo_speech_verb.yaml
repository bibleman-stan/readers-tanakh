name: m4_solo_speech_verb
rule: M4
subcase: solo_speech_verb
severity: STRONG-MERGE-CANDIDATE
description: |
  Single-token bare wayyiqtol speech-verb on its own line. **Per Path 1
  canon revision (2026-05-02 §5 H5b): this spec is REVIEW-REQUIRED only.**
  A finite speech-act verb is propositionally complete on its own
  (canon §1 SJ3, §1 M3 contrast paragraph, §5.0 Propositional
  Completeness Test, §5 H5b). The quoted content on the next line is
  a distinct atomic thought, not a missing complement.

  This spec surfaces the pattern as an editorial judgment call for the
  narrow scope-economy carve-out in §5 H5: a bare-frame + ≤3-prosodic-
  word speech-opening MAY merge for visual rhythm in dialogue chains
  (≥4 consecutive turns). NOT mechanical default — Category B per §2.

  Earlier "propositionally empty without its complement clause" framing
  conflated propositional with informational completeness; that framing
  is retired with Path 1.

  Concrete carve-out instance:
    1 Sam 1:18 lines 89-90:
      וַתֹּ֕אמֶר                                        (and she said)
      תִּמְצָ֧א שִׁפְחָתְךָ֛ חֵ֖ן בְּעֵינֶ֑יךָ            (may your maidservant find favor in your eyes)
    Solo speech verb in dialogue chain — REVIEW for editor scope-economy call.

  Closed list of speech-verb skels mirrors
  `BARE_SPEECH_VERB_SKELETONS` in `validate_speech_intro_framing.py`.

trigger:
  line_n_first_token:
    skeleton_in:
      - "ויאמר"
      - "ויאמרו"
      - "וידבר"
      - "וידברו"
      - "ותאמר"
      - "ותאמרו"
      - "ותדבר"
      - "ויען"
      - "ותען"
      - "ויוסף"
  line_n_last_token:
    skeleton_in:
      - "ויאמר"
      - "ויאמרו"
      - "וידבר"
      - "וידברו"
      - "ותאמר"
      - "ותאמרו"
      - "ותדבר"
      - "ויען"
      - "ותען"
      - "ויוסף"
  line_n_max_prosodic_words: 1
  combined_max_prosodic_words: 5   # narrow scope-economy carve-out per §5 H5; long quotations stay separate (Stan 2026-05-05 REVIEW-REQUIRED ban + spec audit ab3890fd8ee2249bd)

guards:
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol        # block re-absorbing post-S3-split wayyiqtol-headed lines

annotation_template: "M4 solo speech verb merge — narrow scope-economy carve-out (combined ≤5 pw) ({pwc} prosodic words)"
suggested_action: MERGE
