name: h11_short_verse_fronting
rule: H11
subcase: short_verse_fronting
severity: STRONG-MERGE-CANDIDATE
description: |
  Fronting paradox per canon §1: marked Hebrew word order (fronted PP/temporal)
  should merge with main clause when verse is short. Single-token fronted
  constituent on first line, main clause on second.

trigger:
  line_n_first_token:
    morphology: prep   # bound or compound prep first token
  line_n_is_verse_start: true   # only fire on the FIRST line of the verse
  line_n1_anywhere:
    has_finite_verb: true       # main clause must have a verb
  combined_max_prosodic_words: 6

guards:
  - poetic_register
  - next_line_is_vav_coord_pp     # block re-absorbing post-S1-split coord-PP enumeration members
  - next_line_is_vav_coord_np     # block re-absorbing post-S2-split coord-NP enumeration members
  - next_line_is_wayyiqtol      # block re-absorbing post-S3-split wayyiqtol-headed lines
  - line_n_is_purpose_infinitive   # block H11 from absorbing post-S7 purpose-INF orphan-as-N

annotation_template: "Short-verse fronting paradox: fronted PP + main clause (combined {pwc} prosodic words)"
suggested_action: MERGE
