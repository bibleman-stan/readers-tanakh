name: s4_multi_wayyiqtol_clause_split
rule: S4
subcase: multi_wayyiqtol_clause_split
severity: STRONG-SPLIT-CANDIDATE
mode: line

description: |
  Multi-wayyiqtol clause split — a single line carries ≥2 finite wayyiqtol
  verbs each heading its own clause. Per canon §1, each wayyiqtol is the head
  of an atomic thought unit (ATU); multiple wayyiqtols on one line collapse
  multiple ATUs into a single colon, violating the generative force.

  Mid-tightness rule between S3 (closed-list closer-signature) and the legacy
  unrestricted wayyiqtol_mid_line trigger (RUNAWAY at pass 25 in initial S3
  trial, 156+ verses oscillating). S4 fires on the count of wayyiqtols on
  the line, with three explicit suppressions for known-bonded patterns.

  Trigger: line carries ≥2 wayyiqtols (excluding suppressions below).
  Split point: before every wayyiqtol that is not line-initial.

  Suppressions (encoded in multi_wayyiqtol_clause_split_positions):
    1. וַיְהִי temporal-frame opener — line starts with וַיְהִי. The frame is
       subordinating (וַיְהִי בַיּוֹם הַשְּׁלִישִׁי...) and the following wayyiqtol
       is the main clause governed by the frame, not a coordinate clause.
    2. Hendiadys / bonded sequence — every token on the line is a wayyiqtol
       (e.g., וַיָּקָם וַיֵּלֶךְ — bonded action pair sharing semantic ATU).
    3. Shared-DO 3-token bonded pair — line is exactly W₁ W₂ X (e.g.,
       Gen 41:14 וַיְגַלַּח וַיְחַלֵּף שִׂמְלֹתָיו — DO attaches to second verb).

  Example (Gen 50:1 line 3, post-cascade):
    Before: עַל־פְּנֵי אָבִיו וַיֵּבְךְּ עָלָיו וַיִּשַּׁק־לוֹ׃
    After:  עַל־פְּנֵי אָבִיו
            וַיֵּבְךְּ עָלָיו
            וַיִּשַּׁק־לוֹ׃
    Wayyiqtol positions: [2, 4]; non-initial split positions: [2, 4].
    Result: 3 cola — [PP-complement-of-verb-on-prior-line] / [W-A + complement]
    / [W-B + maqfef-PP]. The PP-complement is then absorbed onto the prior
    line by m2_7 (motion-verb-locus-PP completion) on a subsequent pass.

  Example (Gen 29:13):
    Before: ...וַיָּרָץ לִקְרָאתוֹ וַיְחַבֶּק־לוֹ וַיְנַשֶּׁק־לוֹ
    Wayyiqtol positions: [..., n, n+2, n+4]; each wayyiqtol has its own
    complement (לִקְרָאתוֹ, ־לוֹ, ־לוֹ).
    Result: split into 3 cola.

  Architectural note (2026-05-01): designed after parallel diagnostic audit
  (Gen 50:1 in pending.md, audit-B verdict). S4 is the natural follow-up to
  S3 reserved patterns 4-8 in s3_cross_clause_split.yaml; S4 covers the
  count-based residual that S3's closer-signature triggers do not.

trigger:
  line_anywhere:
    multi_wayyiqtol_count: true

guards:
  - poetic_register

annotation_template: "S4 multi-wayyiqtol clause split — ≥2 wayyiqtols each heading own ATU ({pwc} prosodic words)"
suggested_action: SPLIT_AT_FINITE_VERB_BOUNDARY
